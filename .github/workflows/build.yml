name: build gki

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt upgrade -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            gnupg \
            libelf-dev \
            libssl-dev \
            lsb-release \
            software-properties-common \
            wget \
            libncurses-dev \
            binutils

      - name: Build
        run: |
          set -euxo pipefail
          cd "$GITHUB_WORKSPACE/kernel"

          if [ ! -f "common/build.config.gki" ]; then
            echo "No local kernel build config found in the repository."
            echo "This workflow assumes the kernel source tree is already present in the repository."
            exit 1
          fi

          LTO=thin \
          CFLAGS="-Wno-error -Wno-unused-function" \
          CXXFLAGS="-Wno-error -Wno-unused-function" \
          BUILD_CONFIG=common/build.config.gki.x86_64 \
          build/build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-android12-5.10-x86_64_arcvm
          path: ${{ github.workspace }}/out/android12-5.10/dist/bzImage
