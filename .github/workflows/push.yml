name: source

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            gnupg \
            libelf-dev \
            libssl-dev \
            lsb-release \
            software-properties-common \
            wget \
            libncurses-dev \
            binutils \
            repo

      - name: Prepare kernel source
        run: |
          set -euxo pipefail
          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"

          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          cd "${GITHUB_WORKSPACE}/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-arcvm-gki-base \
            --depth 1

          repo sync -f

      - name: Patch kernel with KernelSU
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"

          # Inject KernelSU into the checked-out kernel tree. Keep this on the
          # upstream main branch until a tested revision for ArcVM is selected.
          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -

          test -d drivers/kernelsu

          sed -i 's/check_defconfig//' common/build.config.gki
          sed -i \
            's/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/' \
            common/build.config.gki

          cp \
            common/arch/x86/configs/x86_64_arcvm_defconfig \
            common/arch/x86/configs/x86_64_defconfig

          # Do not enable the unsupported x86 fallback unless the selected
          # KernelSU revision explicitly supports it.

      - name: Build
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/kernel"

          LTO=thin \
          CFLAGS="-Wno-error -Wno-unused-function" \
          CXXFLAGS="-Wno-error -Wno-unused-function" \
          BUILD_CONFIG=common/build.config.gki.x86_64 \
          build/build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-android12-5.10-x86_64_arcvm
          path: "${{ github.workspace }}/kernel/out/android12-5.10/dist/bzImage"
