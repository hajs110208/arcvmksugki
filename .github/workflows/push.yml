name: source

on:
  workflow_dispatch:

concurrency:
  group: source-main-push
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  source:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt upgrade -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            gnupg \
            libelf-dev \
            libssl-dev \
            lsb-release \
            software-properties-common \
            wget \
            libncurses-dev \
            binutils \
            repo

      - name: Prepare kernel source
        run: |
          set -euxo pipefail

          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"

          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          cd "${GITHUB_WORKSPACE}/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-arcvm-gki-base \
            --depth 1

          repo sync -f

      - name: Patch kernel with KernelSU
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}/kernel/common"

          curl --fail --silent --show-error --location \
            https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh \
            | bash -

          test -d drivers/kernelsu

          sed -i 's/check_defconfig//' build.config.gki
          sed -i \
            's/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/' \
            build.config.gki

          cp \
            arch/x86/configs/x86_64_arcvm_defconfig \
            arch/x86/configs/x86_64_defconfig

      - name: Push kernel source to main
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          # Remove repo and nested Git metadata before committing the source.
          rm -rf kernel/.repo
          find kernel -type d -name .git -prune -exec rm -rf {} +
          find kernel -type f -name .git -delete

          git add -A kernel

          if git diff --cached --quiet; then
            echo "No kernel source changes to commit."
            exit 0
          fi

          git commit -m "Add patched kernel source"

          git fetch origin main
          git rebase origin/main

          # Retry in case another workflow pushes between fetch and push.
          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; synchronizing with origin/main (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts."
          exit 1
