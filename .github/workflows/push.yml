name: source

on:
  workflow_dispatch:

concurrency:
  group: source-main-push
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  REPO_SYNC_JOBS: 4

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup needed packages
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            gnupg \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lsb-release \
            python3 \
            software-properties-common \
            wget \
            binutils

          # Install the current Android repo launcher directly.
          # The Ubuntu package may be unavailable or outdated.
          sudo curl \
            --fail \
            --silent \
            --show-error \
            --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /usr/local/bin/repo

          sudo chmod 0755 /usr/local/bin/repo

          repo --version

      - name: Prepare kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"

          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          cd "${GITHUB_WORKSPACE}/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-arcvm-gki-base \
            --depth 1 \
            --no-repo-verify

          # Limit parallelism and disable optional clone bundles/tags
          # to prevent the hosted runner from appearing to hang.
          timeout \
            --signal=TERM \
            --kill-after=60s \
            45m \
            repo sync \
              --fail-fast \
              --current-branch \
              --no-clone-bundle \
              --no-tags \
              -j"${REPO_SYNC_JOBS}"

      - name: Patch kernel with KernelSU
        working-directory: ${{ github.workspace }}/kernel/common
        shell: bash
        run: |
          set -euxo pipefail
          curl -LO https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
          bash setup.sh -- v3.3.0

          test -d drivers/kernelsu

          # The Android 12 / 5.10 ArcVM kernel does not contain the
          # indirect syscall bypass patchset required by newer KernelSU.
          if grep -R -q "X86_FEATURE_INDIRECT_SAFE" \
              drivers/kernelsu arch/x86 include 2>/dev/null; then
            echo "::error::Selected KernelSU requires indirect syscall bypass patches"
            exit 1
          fi

          sed -i 's/check_defconfig//' build.config.gki

          sed -i \
            's/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/' \
            build.config.gki

          cp \
            arch/x86/configs/x86_64_arcvm_defconfig \
            arch/x86/configs/x86_64_defconfig

      - name: Verify kernel source
        working-directory: ${{ github.workspace }}/kernel
        shell: bash
        run: |
          set -euxo pipefail

          test -f common/build.config.gki
          test -f common/build.config.gki.x86_64
          test -d common/drivers/kernelsu

          if grep -R -q "X86_FEATURE_INDIRECT_SAFE" \
              common/drivers/kernelsu \
              common/arch/x86 \
              common/include 2>/dev/null; then
            echo "::error::Kernel source is still missing the indirect syscall bypass patchset"
            exit 1
          fi

      - name: Push kernel source to main
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          # Remove repo and nested Git metadata before committing the source.
          rm -rf kernel/.repo
          find kernel -type d -name .git -prune -exec rm -rf {} +
          find kernel -type f -name .git -delete

          git add -A kernel

          if git diff --cached --quiet; then
            echo "No kernel source changes to commit."
            exit 0
          fi

          git commit -m "Add patched kernel source"

          git fetch origin main
          git rebase origin/main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; synchronizing with origin/main (attempt ${attempt})"

            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts."
          exit 1
