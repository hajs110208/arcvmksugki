name: source

on:
  workflow_dispatch:

concurrency:
  group: source-main-push
  cancel-in-progress: true

permissions:
  contents: write

env:
  DEBIAN_FRONTEND: noninteractive
  REPO_SYNC_JOBS: 4

jobs:
  source:
    runs-on: ubuntu-22.04
    timeout-minutes: 120

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup needed packages
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            curl \
            flex \
            git \
            gnupg \
            libelf-dev \
            libncurses-dev \
            libssl-dev \
            lsb-release \
            python3 \
            software-properties-common \
            wget \
            binutils

          sudo curl \
            --fail \
            --silent \
            --show-error \
            --location \
            https://storage.googleapis.com/git-repo-downloads/repo \
            --output /usr/local/bin/repo

          sudo chmod 0755 /usr/local/bin/repo
          repo --version

      - name: Prepare kernel source
        shell: bash
        run: |
          set -euxo pipefail

          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"

          mkdir -p "${GITHUB_WORKSPACE}/kernel"
          cd "${GITHUB_WORKSPACE}/kernel"

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-arcvm-gki-base \
            --depth 1 \
            --no-repo-verify

          timeout \
            --signal=TERM \
            --kill-after=60s \
            45m \
            repo sync \
              --fail-fast \
              --current-branch \
              --no-clone-bundle \
              --no-tags \
              -j"${REPO_SYNC_JOBS}"

      - name: Patch kernel with KernelSU
        working-directory: ${{ github.workspace }}/kernel/common
        shell: bash
        run: |
          set -euxo pipefail

          curl -LO https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh
          bash setup.sh -- v3.3.0

          test -d drivers/kernelsu

          sed -i 's/check_defconfig//' build.config.gki

          sed -i \
            's/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/' \
            build.config.gki

          cp \
            arch/x86/configs/x86_64_arcvm_defconfig \
            arch/x86/configs/x86_64_defconfig

          if ! grep -q '^CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y' arch/x86/configs/x86_64_defconfig; then
            echo "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y" >> arch/x86/configs/x86_64_defconfig
          fi

      - name: Push kernel source to main
        shell: bash
        run: |
          set -euxo pipefail
          cd "${GITHUB_WORKSPACE}"

          rm -rf kernel/.repo
          find kernel -type d -name .git -prune -exec rm -rf {} +
          find kernel -type f -name .git -delete

          git add -A kernel

          if git diff --cached --quiet; then
            echo "No kernel source changes to commit."
            exit 0
          fi

          git commit -m "Add patched kernel source"

          git fetch origin main
          git rebase origin/main

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              exit 0
            fi

            echo "Push failed; synchronizing with origin/main (attempt ${attempt})"
            git fetch origin main
            git rebase origin/main
          done

          echo "Unable to push after multiple attempts."
          exit 1
