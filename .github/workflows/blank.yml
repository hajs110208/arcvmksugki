name: build gki

on:
  workflow_dispatch: 
jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends bc bison build-essential ca-certificates flex git gnupg libelf-dev libssl-dev lsb-release software-properties-common wget libncurses-dev binutils-dev python3-dev python3-pip liblz4-dev zstd
      - name: Prepare kernel source
        run: |
          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"
          mkdir kernel
          cd kernel
          repo init -u https://android.googlesource.com/kernel/manifest -b common-android12-5.10-arcvm-gki-base --depth 1
          repo sync -f
      - name: Patch with ksu
        run: |
          cd /home/runner/work/arcvmksugki/arcvmksugki/kernel/
          curl -LSs "https://raw.githubusercontent.com/tiann/KernelSU/main/kernel/setup.sh" | bash -
          sed -i "s/check_defconfig//" common/build.config.gki
          sed -i "s/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/" common/build.config.gki
          cp common/arch/x86/configs/x86_64_arcvm_defconfig common/arch/x86/configs/x86_64_defconfig
          
          # Add required config options for KernelSU indirect syscall bypass
          echo "CONFIG_X86_SPEC_CTRL=y" >> common/arch/x86/configs/x86_64_defconfig
          echo "CONFIG_RETPOLINE=y" >> common/arch/x86/configs/x86_64_defconfig
      - name: Build
        run: |
          cd /home/runner/work/arcvmksugki/arcvmksugki/kernel/
          LTO=thin CFLAGS='-Wno-error -Wno-unused-function' CXXFLAGS='-Wno-error -Wno-unused-function' BUILD_CONFIG=common/build.config.gki.x86_64 build/build.sh
      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-android12-5.10-x86_64_arcvm
          path: /home/runner/work/arcvmksugki/arcvmksugki/kernel/out/android12-5.10/dist/bzImage
