name: build gki

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup needed packages
        run: |
          sudo apt update
          sudo apt install -y --no-install-recommends \
            bc \
            bison \
            build-essential \
            ca-certificates \
            flex \
            git \
            gnupg \
            libelf-dev \
            libssl-dev \
            lsb-release \
            software-properties-common \
            wget \
            libncurses-dev \
            binutils \
            repo

      - name: Prepare kernel source
        run: |
          set -euxo pipefail
          git config --global user.email "hajs0208@outlook.kr"
          git config --global user.name "hajs"

          mkdir -p kernel
          cd kernel

          repo init \
            -u https://android.googlesource.com/kernel/manifest \
            -b common-android12-5.10-arcvm-gki-base \
            --depth 1

          repo sync -f

      - name: Patch with ksu
        run: |
          set -euxo pipefail
          cd /home/runner/work/arcvmksugki/arcvmksugki/kernel/

          # Preferred fix:
          # Pin a KernelSU revision that matches the ArcVM 5.10 tree.
          # Replace this with a tested tag/commit for your specific kernel.
          KSU_REF="${KSU_REF:-<compatible-kernelsu-tag-or-commit>}"

          curl -fsSL \
            "https://raw.githubusercontent.com/tiann/KernelSU/${KSU_REF}/kernel/setup.sh" \
            | bash -

          sed -i "s/check_defconfig//" common/build.config.gki
          sed -i \
            "s/DEFCONFIG=gki_defconfig/DEFCONFIG=x86_64_arcvm_defconfig/" \
            common/build.config.gki

          cp \
            common/arch/x86/configs/x86_64_arcvm_defconfig \
            common/arch/x86/configs/x86_64_defconfig

          # Do not enable the unsupported x86 fallback unless your selected
          # KernelSU revision explicitly supports it.
          # echo "CONFIG_KSU_X86_PATCH_SYSCALL_DISPATCHER=y" \
          #   >> common/arch/x86/configs/x86_64_defconfig

      - name: Build
        run: |
          cd /home/runner/work/arcvmksugki/arcvmksugki/kernel/

          LTO=thin \
          CFLAGS="-Wno-error -Wno-unused-function" \
          CXXFLAGS="-Wno-error -Wno-unused-function" \
          BUILD_CONFIG=common/build.config.gki.x86_64 \
          build/build.sh

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: gki-android12-5.10-x86_64_arcvm
          path: /home/runner/work/arcvmksugki/arcvmksugki/kernel/out/android12-5.10/dist/bzImage
